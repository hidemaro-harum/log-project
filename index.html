<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ランダム鼓舞ワード MVP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #111;
    }
    main {
      width: min(92vw, 420px);
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
      text-align: center;
    }
    h1 { margin: 0 0 16px; font-size: 20px; }
    #word {
      margin: 0 0 20px;
      font-size: 32px;
      font-weight: 700;
      min-height: 48px;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      background: #111;
      color: #fff;
    }
  </style>
</head>

<body>
  <main>
    <h1>今日のワード</h1>
    <p id="word" aria-live="polite"></p>
    <button id="nextButton" type="button">次のワード</button>
  </main>

  <script>
    const words = [
      "着手",
      "集中",
      "挑戦",
      "前進",
      "継続",
      "突破",
      "実行",
      "成長"
    ];

    const wordElement = document.getElementById("word");
    const nextButton = document.getElementById("nextButton");

    function pickRandomWord() {
      const randomIndex = Math.floor(Math.random() * words.length);
      wordElement.textContent = words[randomIndex];
    }

    nextButton.addEventListener("click", pickRandomWord);

    pickRandomWord();
  </script>
</body>

</html>
