<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora Log | 作業時間ログ × 日次自動要約</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            /* Colors */
            --bg-color: #f0f2f5;
            --primary: #6366f1;
            /* Indigo */
            --primary-hover: #4f46e5;
            --secondary: #ec4899;
            /* Pink */
            --accent: #8b5cf6;
            /* Violet */

            --text-main: #1f2937;
            --text-muted: #6b7280;
            --text-light: #9ca3af;

            --surface: rgba(255, 255, 255, 0.7);
            --surface-hover: rgba(255, 255, 255, 0.9);
            --border: rgba(255, 255, 255, 0.6);
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.07);

            /* Gradients */
            --brand-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --bg-gradient: radial-gradient(circle at 10% 20%, rgb(239, 246, 255) 0%, rgb(255, 255, 255) 90%);

            /* Spacing & Radius */
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            background-image:
                radial-gradient(at 40% 20%, hsla(28, 100%, 74%, 1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189, 100%, 56%, 1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(340, 100%, 76%, 1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(240, 100%, 70%, 1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22, 100%, 77%, 1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(242, 100%, 70%, 1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343, 100%, 76%, 1) 0px, transparent 50%);
            background-size: 200% 200%;
            animation: gradient-animation 20s ease infinite;

            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            padding-bottom: 40px;
        }

        @keyframes gradient-animation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Overlay to soften the background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(50px);
            z-index: -1;
        }

        header {
            padding: 40px 20px 20px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 8px;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        p.description {
            margin: 0;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
        }

        main {
            max-width: 800px;
            width: 94%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }

        /* Glassmorphism Card */
        section {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        section:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.12);
            background: var(--surface-hover);
        }

        section h2 {
            margin: 0 0 20px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        section h2 i {
            color: var(--primary);
            font-size: 22px;
        }

        /* Form Styles */
        form {
            display: grid;
            gap: 20px;
        }

        .form-row {
            display: grid;
            gap: 16px;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        input[type="text"],
        input[type="time"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            font-family: inherit;
            color: var(--text-main);
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        input:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* Button Styles */
        button {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--brand-gradient);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: none;
        }

        button.secondary:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-main);
            filter: none;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Table Styles */
        .table-container {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.4);
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        th {
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.6);
        }

        /* Summary Box */
        .summary-box {
            white-space: pre-line;
            background: linear-gradient(to right bottom, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.4));
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 20px;
            border-radius: var(--radius-md);
            min-height: 100px;
            font-size: 15px;
            color: var(--text-main);
            line-height: 1.7;
        }

        .totals {
            margin-top: 16px;
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            text-align: right;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .actions.right {
            justify-content: flex-end;
        }

        /* Responsive */
        @media (min-width: 650px) {
            .form-row {
                grid-template-columns: 2fr 1fr 1fr;
            }

            .actions {
                /* Align buttons to match input height if needed */
            }
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>

<body>
    <header>
        <h1>
            <i class="ph ph-clock-countdown"></i>
            Aurora Log
        </h1>
        <p class="description">作業時間を美しく記録し、AIが集計・要約します。</p>
    </header>

    <main>
        <!-- 入力セクション -->
        <section>
            <h2><i class="ph ph-pencil-simple-line"></i> 作業ログ入力</h2>
            <form id="log-form">
                <div class="form-row">
                    <div>
                        <label for="task">作業内容</label>
                        <input type="text" id="task" placeholder="例：UIデザインの修正" required />
                    </div>
                    <div>
                        <label for="start-time">開始時間</label>
                        <input type="time" id="start-time" required />
                    </div>
                    <div>
                        <label for="end-time">終了時間</label>
                        <input type="time" id="end-time" required />
                    </div>
                </div>
                <div class="actions right">
                    <button type="button" class="secondary" id="clear-day">
                        <i class="ph ph-trash"></i> リセット
                    </button>
                    <button type="submit">
                        <i class="ph ph-plus-circle"></i> 追加する
                    </button>
                </div>
            </form>
        </section>

        <!-- 一覧セクション -->
        <section>
            <h2><i class="ph ph-list-dashes"></i> 本日の作業ログ一覧</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>作業内容</th>
                            <th>開始</th>
                            <th>終了</th>
                            <th style="text-align: right;">時間 (分)</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body">
                        <tr>
                            <td colspan="4" class="empty-state">まだログがありません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="totals" id="totals">合計: 0分（0.0時間）</div>
        </section>

        <!-- AUI要約セクション -->
        <section>
            <h2><i class="ph ph-magic-wand"></i> 日次AI要約</h2>
            <div class="summary-box" id="summary-output">
                ここにAIによる要約が表示されます...
            </div>
            <div class="actions right" style="margin-top: 16px;">
                <button type="button" id="generate-summary">
                    <i class="ph ph-sparkle"></i> 本日の要約を生成
                </button>
            </div>
        </section>
    </main>

    <script>
        // ====== 設定ここから ======
        // OpenAI APIキーを入力してください（GitHubなどに公開しないよう注意）
        const OPENAI_API_KEY = "YOUR_API_KEY";
        const OPENAI_MODEL = "gpt-4o-mini";
        // ====== 設定ここまで ======

        // DOM取得
        const form = document.getElementById("log-form");
        const taskInput = document.getElementById("task");
        const startInput = document.getElementById("start-time");
        const endInput = document.getElementById("end-time");
        const tableBody = document.getElementById("log-table-body");
        const totals = document.getElementById("totals");
        const summaryOutput = document.getElementById("summary-output");
        const generateButton = document.getElementById("generate-summary");
        const clearButton = document.getElementById("clear-day");

        // 今日の日付キーを作成
        const todayKey = `workLogs_${new Date().toISOString().slice(0, 10)}`;

        // LocalStorageからログを読み込む
        function loadLogs() {
            const raw = localStorage.getItem(todayKey);
            return raw ? JSON.parse(raw) : [];
        }

        // LocalStorageにログを保存する
        function saveLogs(logs) {
            localStorage.setItem(todayKey, JSON.stringify(logs));
        }

        // 所要時間（分）を計算する
        function calculateMinutes(start, end) {
            const [sh, sm] = start.split(":").map(Number);
            const [eh, em] = end.split(":").map(Number);
            const startMinutes = sh * 60 + sm;
            const endMinutes = eh * 60 + em;
            return endMinutes - startMinutes;
        }

        // テーブルと合計を描画する
        function renderLogs() {
            const logs = loadLogs();
            tableBody.innerHTML = "";

            if (logs.length === 0) {
                // Empty state
                const row = document.createElement("tr");
                row.innerHTML = "<td colspan='4' class='empty-state'>まだログがありません。</td>";
                tableBody.appendChild(row);
                totals.textContent = "合計: 0分（0.0時間）";
                return;
            }

            let totalMinutes = 0;

            logs.forEach((log) => {
                totalMinutes += log.durationMinutes;
                const row = document.createElement("tr");
                row.innerHTML = `
          <td>${log.task}</td>
          <td>${log.start}</td>
          <td>${log.end}</td>
          <td style="text-align: right; font-weight: 500;">${log.durationMinutes}</td>
        `;
                tableBody.appendChild(row);
            });

            const totalHours = (totalMinutes / 60).toFixed(1);
            totals.textContent = `合計: ${totalMinutes}分（${totalHours}時間）`;
        }

        // 追加ボタンの処理
        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const task = taskInput.value.trim();
            const start = startInput.value;
            const end = endInput.value;

            if (!task || !start || !end) {
                alert("すべての項目を入力してください。");
                return;
            }

            const durationMinutes = calculateMinutes(start, end);

            if (durationMinutes <= 0) {
                alert("終了時間は開始時間より後にしてください。");
                return;
            }

            const logs = loadLogs();
            logs.push({ task, start, end, durationMinutes });
            saveLogs(logs);

            form.reset();
            renderLogs();
        });

        // 今日のログをクリアする
        clearButton.addEventListener("click", () => {
            if (confirm("今日のログをすべて削除しますか？")) {
                localStorage.removeItem(todayKey);
                summaryOutput.textContent = "ここにAIによる要約が表示されます...";
                renderLogs();
            }
        });

        // AI要約の生成
        generateButton.addEventListener("click", async () => {
            const logs = loadLogs();
            if (logs.length === 0) {
                alert("ログがないため要約できません。");
                return;
            }

            if (!OPENAI_API_KEY || OPENAI_API_KEY === "YOUR_API_KEY") {
                alert("OpenAI APIキーを設定してください。スクリプト内の 'YOUR_API_KEY' を書き換える必要があります。");
                return;
            }

            generateButton.disabled = true;
            generateButton.innerHTML = '<i class="ph ph-spinner ph-spin"></i> 生成中...';
            summaryOutput.textContent = "要約を生成中です...";

            const totalMinutes = logs.reduce((sum, log) => sum + log.durationMinutes, 0);
            const workItems = logs
                .map((log, index) => `${index + 1}. ${log.task} (${log.durationMinutes}分)`)
                .join("\n");

            const prompt = `
あなたは作業ログの要約者です。以下の情報を使って、
指定形式で日本語の要約を作成してください。

## 入力情報
- 作業件数: ${logs.length}
- 合計作業時間: ${totalMinutes}分
- 作業一覧:\n${workItems}

## 要約ルール
- 本日の作業件数と合計時間
- 作業内容の比率・傾向
- 作業の偏りや気づき（簡潔に）
- 5行以内、箇条書きで簡潔に
`;

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: OPENAI_MODEL,
                        messages: [
                            { role: "system", content: "あなたは日本語で簡潔に要約するアシスタントです。" },
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.4
                    })
                });

                if (!response.ok) {
                    throw new Error(`APIエラー: ${response.status}`);
                }

                const data = await response.json();
                const summary = data.choices[0]?.message?.content?.trim();

                if (!summary) {
                    throw new Error("要約結果が取得できませんでした。");
                }

                summaryOutput.textContent = summary;
            } catch (error) {
                alert(`要約に失敗しました: ${error.message}`);
                summaryOutput.textContent = "要約の生成に失敗しました。";
            } finally {
                generateButton.disabled = false;
                generateButton.innerHTML = '<i class="ph ph-sparkle"></i> 本日の要約を生成';
            }
        });

        // 初期表示
        renderLogs();
    </script>
</body>

</html>
