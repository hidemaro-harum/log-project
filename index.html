<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>作業時間ログ × 日次自動要約</title>
    <style>
        :root {
            --bg: #f7f7f7;
            --panel: #ffffff;
            --text: #222222;
            --muted: #666666;
            --border: #d9d9d9;
            --accent: #222222;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            padding: 24px 16px 8px;
            text-align: center;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 4px;
        }

        p.description {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        section {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        section h2 {
            margin-top: 0;
            font-size: 16px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        .form-row {
            display: grid;
            gap: 12px;
        }

        label {
            font-size: 12px;
            color: var(--muted);
        }

        input[type="text"],
        input[type="time"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 14px;
        }

        button {
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        button.secondary {
            background: #555;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th,
        td {
            border-bottom: 1px solid var(--border);
            padding: 8px 6px;
            text-align: left;
        }

        th {
            color: var(--muted);
            font-weight: 600;
        }

        .summary-box {
            white-space: pre-line;
            background: #fafafa;
            border: 1px dashed var(--border);
            padding: 12px;
            border-radius: 8px;
            min-height: 72px;
            font-size: 14px;
        }

        .totals {
            margin-top: 12px;
            font-size: 14px;
            color: var(--muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        @media (min-width: 600px) {
            .form-row {
                grid-template-columns: 2fr 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>作業時間ログ × 日次自動要約</h1>
        <p class="description">今日の作業ログを記録し、AIで要約します。</p>
    </header>

    <main>
        <section>
            <h2>作業ログ入力</h2>
            <form id="log-form">
                <div class="form-row">
                    <div>
                        <label for="task">作業内容</label>
                        <input type="text" id="task" placeholder="例：仕様整理" required />
                    </div>
                    <div>
                        <label for="start-time">開始時間</label>
                        <input type="time" id="start-time" required />
                    </div>
                    <div>
                        <label for="end-time">終了時間</label>
                        <input type="time" id="end-time" required />
                    </div>
                </div>
                <div class="actions">
                    <button type="submit">追加</button>
                    <button type="button" class="secondary" id="clear-day">今日のログをクリア</button>
                </div>
            </form>
        </section>

        <section>
            <h2>本日の作業ログ一覧</h2>
            <table>
                <thead>
                    <tr>
                        <th>作業内容</th>
                        <th>開始時間</th>
                        <th>終了時間</th>
                        <th>所要時間（分）</th>
                    </tr>
                </thead>
                <tbody id="log-table-body">
                    <tr>
                        <td colspan="4">まだログがありません。</td>
                    </tr>
                </tbody>
            </table>
            <div class="totals" id="totals">合計: 0分（0.0時間）</div>
        </section>

        <section>
            <h2>日次AI要約</h2>
            <div class="actions" style="margin-bottom: 12px;">
                <button type="button" id="generate-summary">本日の要約を生成</button>
            </div>
            <div class="summary-box" id="summary-output">ここに要約が表示されます。</div>
        </section>
    </main>

    <script>
        // ====== 設定ここから ======
        // OpenAI APIキーを入力してください（GitHubなどに公開しないよう注意）
        const OPENAI_API_KEY = "YOUR_API_KEY";
        const OPENAI_MODEL = "gpt-4o-mini";
        // ====== 設定ここまで ======

        // DOM取得
        const form = document.getElementById("log-form");
        const taskInput = document.getElementById("task");
        const startInput = document.getElementById("start-time");
        const endInput = document.getElementById("end-time");
        const tableBody = document.getElementById("log-table-body");
        const totals = document.getElementById("totals");
        const summaryOutput = document.getElementById("summary-output");
        const generateButton = document.getElementById("generate-summary");
        const clearButton = document.getElementById("clear-day");

        // 今日の日付キーを作成
        const todayKey = `workLogs_${new Date().toISOString().slice(0, 10)}`;

        // LocalStorageからログを読み込む
        function loadLogs() {
            const raw = localStorage.getItem(todayKey);
            return raw ? JSON.parse(raw) : [];
        }

        // LocalStorageにログを保存する
        function saveLogs(logs) {
            localStorage.setItem(todayKey, JSON.stringify(logs));
        }

        // 所要時間（分）を計算する
        function calculateMinutes(start, end) {
            const [sh, sm] = start.split(":").map(Number);
            const [eh, em] = end.split(":").map(Number);
            const startMinutes = sh * 60 + sm;
            const endMinutes = eh * 60 + em;
            return endMinutes - startMinutes;
        }

        // テーブルと合計を描画する
        function renderLogs() {
            const logs = loadLogs();
            tableBody.innerHTML = "";

            if (logs.length === 0) {
                const row = document.createElement("tr");
                row.innerHTML = "<td colspan='4'>まだログがありません。</td>";
                tableBody.appendChild(row);
                totals.textContent = "合計: 0分（0.0時間）";
                return;
            }

            let totalMinutes = 0;

            logs.forEach((log) => {
                totalMinutes += log.durationMinutes;
                const row = document.createElement("tr");
                row.innerHTML = `
          <td>${log.task}</td>
          <td>${log.start}</td>
          <td>${log.end}</td>
          <td>${log.durationMinutes}</td>
        `;
                tableBody.appendChild(row);
            });

            const totalHours = (totalMinutes / 60).toFixed(1);
            totals.textContent = `合計: ${totalMinutes}分（${totalHours}時間）`;
        }

        // 追加ボタンの処理
        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const task = taskInput.value.trim();
            const start = startInput.value;
            const end = endInput.value;

            if (!task || !start || !end) {
                alert("すべての項目を入力してください。");
                return;
            }

            const durationMinutes = calculateMinutes(start, end);

            if (durationMinutes <= 0) {
                alert("終了時間は開始時間より後にしてください。");
                return;
            }

            const logs = loadLogs();
            logs.push({ task, start, end, durationMinutes });
            saveLogs(logs);

            form.reset();
            renderLogs();
        });

        // 今日のログをクリアする
        clearButton.addEventListener("click", () => {
            if (confirm("今日のログをすべて削除しますか？")) {
                localStorage.removeItem(todayKey);
                summaryOutput.textContent = "ここに要約が表示されます。";
                renderLogs();
            }
        });

        // AI要約の生成
        generateButton.addEventListener("click", async () => {
            const logs = loadLogs();
            if (logs.length === 0) {
                alert("ログがないため要約できません。");
                return;
            }

            if (!OPENAI_API_KEY || OPENAI_API_KEY === "YOUR_API_KEY") {
                alert("OpenAI APIキーを設定してください。");
                return;
            }

            generateButton.disabled = true;
            summaryOutput.textContent = "要約を生成中です...";

            const totalMinutes = logs.reduce((sum, log) => sum + log.durationMinutes, 0);
            const workItems = logs
                .map((log, index) => `${index + 1}. ${log.task} (${log.durationMinutes}分)`)
                .join("\n");

            const prompt = `
あなたは作業ログの要約者です。以下の情報を使って、
指定形式で日本語の要約を作成してください。

## 入力情報
- 作業件数: ${logs.length}
- 合計作業時間: ${totalMinutes}分
- 作業一覧:\n${workItems}

## 要約ルール
- 本日の作業件数と合計時間
- 作業内容の比率・傾向
- 作業の偏りや気づき（簡潔に）
- 5行以内、箇条書きで簡潔に
`;

            try {
                const response = await fetch("https://api.openai.com/v1/responses", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: OPENAI_MODEL,
                        input: [
                            { role: "system", content: "あなたは日本語で簡潔に要約するアシスタントです。" },
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.4
                    })
                });

                if (!response.ok) {
                    throw new Error(`APIエラー: ${response.status}`);
                }

                const data = await response.json();
                const summary = data.output_text?.trim();

                if (!summary) {
                    throw new Error("要約結果が取得できませんでした。");
                }

                summaryOutput.textContent = summary;
            } catch (error) {
                alert(`要約に失敗しました: ${error.message}`);
                summaryOutput.textContent = "ここに要約が表示されます。";
            } finally {
                generateButton.disabled = false;
            }
        });

        // 初期表示
        renderLogs();
    </script>
</body>

</html>
