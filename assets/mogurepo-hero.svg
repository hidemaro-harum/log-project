      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <filter id="shadow" x="250" y="70" width="700" height="680" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#8D5E24" flood-opacity="0.22"/>
    </filter>
  </defs>
