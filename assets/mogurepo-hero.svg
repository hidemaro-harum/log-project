      <stop stop-color="#FFF6DE"/>
      <stop offset="0.48" stop-color="#FFE5C2"/>
      <stop offset="1" stop-color="#D9F2E6"/>
    </linearGradient>
    <linearGradient id="phone" x1="449" y1="100" x2="806" y2="680" gradientUnits="userSpaceOnUse">
